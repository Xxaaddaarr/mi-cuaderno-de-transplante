  --am:#B87400;--pm:#15807A;--nt:#5143C4;
  --scrim:rgb(8 14 26 / .48);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:16px;
}

  --am:#F0B23E;--pm:#4CC3BB;--nt:#A096FF;--scrim:rgb(0 0 0 / .6);color-scheme:dark}}
:root[data-theme="dark"]{

  --am:#F0B23E;--pm:#4CC3BB;--nt:#A096FF;--scrim:rgb(0 0 0 / .6);color-scheme:dark}
/* Colores del tema: claro por defecto, oscuro con más especificidad */
:root[data-accent="gris"]{--accent:#475467;--accent-soft:#E6E9EE}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-accent="gris"]{--accent:#B4BCC8;--accent-soft:#252C37}
  :root:not([data-theme="light"])[data-accent="rosa"]{--accent:#FF8CC2;--accent-soft:#43162F}
  :root:not([data-theme="light"])[data-accent="verde"]{--accent:#5FD4BC;--accent-soft:#0F332D}
  :root:not([data-theme="light"])[data-accent="violeta"]{--accent:#B79CFF;--accent-soft:#2A1C4D}
}

:root[data-theme="dark"][data-accent="rosa"]{--accent:#FF8CC2;--accent-soft:#43162F}
:root[data-theme="dark"][data-accent="verde"]{--accent:#5FD4BC;--accent-soft:#0F332D}
:root[data-theme="dark"][data-accent="violeta"]{--accent:#B79CFF;--accent-soft:#2A1C4D}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.05;font-weight:700;margin-top:4px}
h1 small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
h2{font-size:18px;font-weight:700;line-height:1.2}
h3{font-size:22px;font-weight:700;line-height:1.15}
p{margin:0}
b{font-weight:700}
.sub{color:var(--muted);font-size:13.5px}
.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4}
.err{color:var(--bad);font-weight:600;font-size:13.5px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.view{display:grid;gap:16px;padding-top:4px}
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eyebrow svg{width:14px;height:14px;flex:none}
.pill-ro{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px}

.btn{appearance:none;font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{width:auto;padding:7px 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[data-armed]{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.next{border-radius:var(--r);padding:16px;display:grid;gap:10px;background:var(--accent);color:var(--accent-ink)}
.next.bad{background:var(--bad);color:var(--on-bad)}
.next.calm{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.next .lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.next .row-b{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.next .big{font-family:var(--f-data);font-size:42px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.next .names{font-weight:600;line-height:1.35}
.next .btn{background:var(--accent-ink);color:var(--accent);border:0}
.next.bad .btn{background:var(--on-bad);color:var(--bad)}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:8px;border-radius:3px;background:var(--surface-2)}
.prog i.ok{background:var(--ok)}.prog i.late{background:var(--warn)}.prog i.skip{background:var(--muted);opacity:.45}.prog i.over{background:var(--bad)}.prog i.due{background:var(--accent)}
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.note svg{width:20px;height:20px;color:var(--warn);margin-top:1px}
.note.info{background:var(--accent-soft)}
.note.info svg{color:var(--accent)}

.slot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;scroll-margin-top:96px}
.slot-h{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;background:color-mix(in srgb,var(--b) 10%,var(--surface))}
.slot-time{font-family:var(--f-data);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.band{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--b)}
.slot-meta{margin-left:auto;font-family:var(--f-data);font-size:13px;color:var(--muted)}
.med{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.check{appearance:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.check svg{width:18px;height:18px}
.check:hover:not(:disabled){border-color:var(--ok);color:var(--line)}
.check:disabled{cursor:default}
.check.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check.done.late{background:var(--warn);border-color:var(--warn)}
.check.skip{border-style:dashed;border-color:var(--muted);color:var(--muted)}
.med-body{appearance:none;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;display:grid;gap:2px;min-width:0}
.med-name{font-weight:700}
.med-dose{font-weight:500;color:var(--muted)}
.med-note{font-size:12.5px;color:var(--muted);line-height:1.35}
.strict{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.taper{font-size:12px;font-weight:700;color:var(--warn)}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px;justify-self:end}
.chip svg{width:12px;height:12px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.due{background:var(--accent-soft);color:var(--accent)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.wcard{border-color:var(--accent)}
.wbar{position:relative;height:14px;border-radius:7px;background:var(--surface-2);margin:6px 0 2px}
.wbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--accent)}
.wbar .mk{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.wbar .mk.soon{background:var(--warn)}
.wlab{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.wlab span{display:grid;gap:1px}.wlab span:nth-child(2){text-align:center}.wlab span:last-child{text-align:right}
.wlab small{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{appearance:none;display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.sw i{width:18px;height:18px;border-radius:50%;background:var(--sw)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.topbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pcards{display:grid;gap:10px}
.pcard{appearance:none;display:grid;gap:5px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.pcard.bad{border-color:var(--bad)}
.pcard.warn{border-color:var(--warn)}
.pc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc-h b{font-size:16px}
.pc-k,.pc-l{font-size:13px}
.pc-a{font-size:12.5px;color:var(--bad);font-weight:600}
.pc-n{font-size:12px;color:var(--muted)}
.daily{gap:14px}
.cklist{display:grid;gap:6px}
.ck{appearance:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.ck i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--surface)}
.ck i svg{width:14px;height:14px}
.ck.done i{background:var(--ok);border-color:var(--ok)}
.ck b{font-size:13px;color:var(--muted);font-weight:600}
.ck.done b{color:var(--ink)}
.ck:disabled{cursor:default}
.water{display:grid;gap:8px}
.water .bar{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.water .bar i{display:block;height:100%;border-radius:6px;background:var(--pm)}
.wbtns{display:flex;gap:8px;flex-wrap:wrap}
.offday{display:grid;gap:4px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;font-size:13.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.card.soft{background:var(--accent-soft);border-color:transparent}
.card.okcard{background:var(--ok-soft);border-color:transparent}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.fgrid.full{grid-column:1/-1}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field.full{grid-column:1/-1}
.field>label,.field>.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.inwrap{position:relative}
.inwrap .u{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:var(--f-data);font-size:12px;color:var(--muted);pointer-events:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
.inwrap input{padding-right:58px;font-family:var(--f-data);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tog{appearance:none;font:inherit;font-size:13px;font-weight:600;padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.radio{position:relative}
.radio input{position:absolute;opacity:0;width:1px;height:1px}
.radio span{display:inline-block;font-size:13px;font-weight:600;padding:7px 11px;border-radius:99px;border:1px solid var(--line);cursor:pointer}
.radio input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.radio input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checkrow{display:flex;gap:10px;align-items:center;font-weight:600;grid-column:1/-1;font-size:14px}
.checkrow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{display:grid;gap:1px;min-width:0}
.kv dt{font-size:11.5px;color:var(--muted);font-weight:600}
.kv dd{margin:0;font-family:var(--f-data);font-weight:600;font-variant-numeric:tabular-nums}
.kv dd small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:11.5px}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:12px;background:var(--warn-soft)}
.alert.bad{background:var(--bad-soft)}
.alert svg{color:var(--warn);width:18px;height:18px;margin-top:2px}
.alert.bad svg{color:var(--bad)}
.alert .t{font-weight:700}
.alert .m{font-size:13px;color:var(--ink);opacity:.85}
.empty-s{font-size:13.5px;color:var(--muted);padding:12px 14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px;align-content:start}
.kpi b{font-family:var(--f-data);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12.5px;color:var(--muted);line-height:1.3}
.kpi.ok b,.t-ok{color:var(--ok)}.kpi.warn b,.t-warn{color:var(--warn)}.kpi.bad b,.t-bad{color:var(--bad)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;vertical-align:middle}
th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
th .dw,th .dd{display:block}
th .dd{font-size:13px;color:var(--ink);letter-spacing:0}
th.today .dd{color:var(--accent)}
td.l,th.l{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
tr:last-child td{border-bottom:0}
.dots{display:inline-flex;gap:2px}
.dotbtn{appearance:none;border:0;background:none;padding:5px 3px;cursor:pointer;display:inline-grid;place-items:center}
.dotbtn:disabled{cursor:default}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--surface-2)}
.dot.ok{background:var(--ok)}.dot.late{background:var(--warn)}.dot.miss{background:var(--bad)}
.dot.skip{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}
.dot.over{background:transparent;box-shadow:inset 0 0 0 2px var(--bad)}
.dot.na{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* análisis */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg .tog{white-space:nowrap}
.headline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.headline .big{font-family:var(--f-data);font-size:38px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.chart{position:relative;min-height:210px}
.chart svg{display:block;touch-action:pan-y}
.c-grid{stroke:var(--line);stroke-width:1}
.c-tick{fill:var(--muted);font:500 10.5px var(--f-data)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:color-mix(in srgb,var(--accent) 12%,transparent)}
.c-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.c-last{fill:var(--ink);font:600 12px var(--f-data)}
.c-cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.c-hi{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;padding:6px 9px;border-radius:8px;white-space:nowrap;z-index:2}

.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:18px}
.doc .kpi{background:var(--bg);border-color:transparent}
.doc-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px}
.ev .when{font-family:var(--f-data);color:var(--muted);font-size:12.5px;padding-top:1px}
.sumtxt{font-family:var(--f-data);font-size:12.5px;min-height:220px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

dialog.sheet{border:0;padding:0;width:100%;max-width:480px;max-height:90vh;max-height:90dvh;margin:auto auto 0;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);overflow:auto}
dialog.sheet::backdrop{background:var(--scrim)}
@media (min-width:700px){dialog.sheet{margin:auto;border-radius:22px}}

<script>
(() => {
const DAYS=['dom','lun','mar','mié','jue','vie','sáb'];
const DOW_FULL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const TYPES=['Inmunosupresor','Corticoide','Antibiótico','Antiviral','Antifúngico','Protector gástrico','Antihipertensivo','Otro'];
const UNITS=[['cápsula','cápsulas'],['tableta','tabletas'],['mL','mL'],['sobre','sobres'],['gota','gotas'],['ampolla','ampollas']];
const REASONS=['Me olvidé','Vómito o náuseas','Indicación médica','Me quedé sin medicamento'];
const SYMPTOMS=['Fiebre o escalofríos','Dolor en la zona del injerto','Orino menos','Ardor al orinar','Hinchazón','Diarrea','Temblor','Náuseas'];
const RED_SYMPTOMS=SYMPTOMS.slice(0,3);
const LABS=[['crea','Creatinina','mg/dL'],['urea','Urea','mg/dL'],['hb','Hemoglobina','g/dL'],['tac','Dosaje de tacrolimus','ng/mL']];
const TABS=[['hoy','Hoy','pill'],['controles','Controles','pulse'],['analisis','Análisis','flask'],['historial','Historial','cal'],['equipo','Equipo','steth']];

const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayKey=()=>dkey(new Date());
const daysBetween=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const nowHHMM=()=>fromMin(nowMin());
const fmtDate=d=>`${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const fmtKey=k=>fmtDate(parseKey(k));
const fmtShort=k=>{const d=parseKey(k);return `${d.getDate()} ${MONTHS[d.getMonth()]}`};
const fmtDur=m=>m<60?`${m} min`:`${Math.floor(m/60)} h${m%60?' '+pad(m%60)+' min':''}`;
const fmtNum=v=>String(Number(Number(v).toFixed(2)));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  pill:svg('<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>'),
  pulse:svg('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'),
  cal:svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  steth:svg('<path d="M11 2v2M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/>'),
  check:svg('<path d="M20 6 9 17l-5-5"/>'),
  x:svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  list:svg('<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>'),
  flask:svg('<path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/>'),
  alert:svg('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/>'),
  bell:svg('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'),
  copy:svg('<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  eye:svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>'),
};

/* ---------- estado ---------- */
let S={plan:null,days:{}}, db=null, canWrite=false, phase='loading', stale=false;
let tab='hoy', flash=null, cur=null, planEdit=null, labSel='crea', pendingRender=false;
/* Personal de la unidad: rol (admin | doctor | nurse), modo de la app y lo que puede editar */
let staffRole=null, staffName='', hasOwn=true, mode='patient', canEditPlan=false, panelRows=null, panelAt=null, panelErr='';
const view=document.getElementById('view'), sheet=document.getElementById('sheet'), sheetIn=document.getElementById('sheet-in');
/* Cada medicamento puede tener varias versiones (dosis, horario o frecuencia distintos) con fechas from/until; gid es su identidad estable. */
const allV=()=>(S.plan&&S.plan.meds)||[];
const gidOf=m=>m.gid||m.id;
const gids=()=>[...new Set(allV().map(gidOf))];
const byFrom=(a,b)=>(a.from||'')<(b.from||'')?-1:(a.from||'')>(b.from||'')?1:0;
function pickV(list,gid,k){const vs=list.filter(m=>gidOf(m)===gid).sort(byFrom);let best=null;for(const m of vs)if((m.from||'')<=k)best=m;return best||vs[0]||null}
function versionOn(gid,k){const v=pickV(allV(),gid,k);return v&&(!v.from||v.from<=k)&&(!v.until||k<=v.until)?v:null}
const medsOn=k=>gids().map(g=>versionOn(g,k)).filter(Boolean);
const latestV=gid=>allV().filter(m=>gidOf(m)===gid).sort(byFrom).pop();
const day=k=>S.days[k]||{};

/* ---------- reglas de medicación ---------- */
/* Nivel de cada medicamento: crítico (a la hora exacta), profiláctico o flexible (vitaminas, etc.). */
const LEVELS={
  critical:{label:'Crítico',tol:1,rep:[0,5,10,15,20,30,45,60]},
  prophylactic:{label:'Profiláctico',tol:15,rep:[0,10,20,30,45,60]},
  flexible:{label:'Flexible',tol:60,rep:[0,30]},
};
const LV_RANK={critical:3,prophylactic:2,flexible:1};
const levelOf=m=>m.level||(m.strict?'critical':['Antibiótico','Antiviral','Antifúngico'].includes(m.type)?'prophylactic':'flexible');
const tolOf=m=>m.tol!=null&&m.tol!==''?Number(m.tol):LEVELS[levelOf(m)].tol;
const levelTag=m=>{const l=levelOf(m);return l==='flexible'?'':`${LEVELS[l].label} · ±${tolOf(m)} min`};
function scheduledOn(m,k){
  if(m.from&&k<m.from)return false;
  if(m.until&&k>m.until)return false;
  const f=m.freq||{t:'d'};
  if(f.t==='alt')return Math.abs(daysBetween(f.start,k))%2===0;
  if(f.t==='w')return parseKey(k).getDay()===Number(f.dow);
  return true;
}
function nextOn(m,k){for(let i=1;i<=14;i++){const kk=dkey(addDays(parseKey(k),i));if(scheduledOn(m,kk))return {kk,i}}return null}
const rec=(k,m,i)=>(day(k).doses||{})[gidOf(m)+'#'+i];
function slotStatus(k,m,i){
  const r=rec(k,m,i), s=toMin(m.times[i]), tk=todayKey(), tol=tolOf(m);
  if(r&&r.s==='taken'){if(!r.at||r.nt)return{k:'ok',at:r.at||null,nt:true};const diff=toMin(r.at)-s;return{k:Math.abs(diff)>tol?'late':'ok',diff,at:r.at}}
  if(r&&r.s==='skip')return{k:'skip',reason:r.reason};
  if(k<tk)return{k:'miss'};
  if(k>tk)return{k:'future'};
  const n=nowMin();
  if(n<s)return{k:'pending',inMin:s-n};
  if(r&&r.s==='snooze'&&toMin(r.until)>n)return{k:'snooze',until:r.until,mins:n-s};
  if(n<=s+tol)return{k:'due',mins:n-s};
  return{k:'overdue',mins:n-s};
}
function slotsFor(k){
  const out=[];
  medsOn(k).forEach((m,mi)=>{if(!scheduledOn(m,k))return;m.times.forEach((t,i)=>out.push({med:m,i,time:t,mi,st:slotStatus(k,m,i)}))});
  return out.sort((a,b)=>toMin(a.time)-toMin(b.time)||a.mi-b.mi);
}
const isDone=k=>k==='ok'||k==='late'||k==='skip';
function taperFor(m,k){
  const tp=m.taper;if(!tp)return null;
  const pos=tp.n-1+daysBetween(tp.date,k), lvl=Math.floor(pos/tp.every);
  const mg=tp.mg-lvl*tp.step, count=((pos%tp.every)+tp.every)%tp.every+1;
  const hasMin=tp.min!=null&&tp.min!=='', floor=hasMin?Number(tp.min):0;
  if(hasMin&&mg<=floor)return{mg:floor,maint:true};
  if(mg<=0)return{mg:null,ask:true};
  return{mg,count,every:tp.every,last:count===tp.every,next:hasMin?Math.max(mg-tp.step,floor):(mg-tp.step>0?mg-tp.step:null)};
}
const parseStrength=s=>{const r=/^\s*(\d+(?:[.,]\d+)?)\s*(mg|mcg|g|mL)\s*$/i.exec(s||'');return r?Number(r[1].replace(',','.')):null};
function fmtQty(q){if(q==null)return '';const w=Math.floor(q),fr=Math.round((q-w)*100)/100;const f={0.25:'¼',0.5:'½',0.75:'¾'}[fr];if(!fr)return String(w);return f?(w?w:'')+f:String(q)}
const unitWord=(u,q)=>{const e=UNITS.find(x=>x[0]===u);return e?(q>1?e[1]:e[0]):(u||'')};
function doseText(m,k){
  const tp=taperFor(m,k), s=parseStrength(m.strength);
  if(tp&&tp.ask)return 'Dosis por confirmar';
  if(tp){const pills=s?tp.mg/s:null;return `${fmtNum(tp.mg)} mg`+(pills?` · ${fmtQty(pills)} ${unitWord(m.unit,pills)}`:'')}
  if(m.qty==null)return m.strength||'';
  const tot=s&&m.qty!==1?` (${fmtNum(s*m.qty)} ${m.strength.replace(/^[\d.,\s]+/,'')})`:'';
  return `${fmtQty(m.qty)} ${unitWord(m.unit,m.qty)}${m.strength?` de ${m.strength}`:''}${tot}`;
}
function taperNote(m,k){
  const tp=taperFor(m,k);if(!tp)return '';
  if(tp.ask)return 'Pregunta tu nueva dosis a la licenciada';
  if(tp.maint)return `Dosis fija de ${fmtNum(tp.mg)} mg`;
  if(tp.last)return `Última de ${fmtNum(tp.mg)} mg · confirma con la licenciada ${tp.next?`si mañana bajas a ${fmtNum(tp.next)} mg`:'tu nueva dosis'}`;
  return `Dosis ${tp.count} de ${tp.every} de ${fmtNum(tp.mg)} mg`;
}
const freqLabel=m=>{const f=m.freq||{t:'d'};return f.t==='alt'?'Interdiario (día por medio)':f.t==='w'?`Una vez por semana, los ${['domingos','lunes','martes','miércoles','jueves','viernes','sábados'][f.dow]}`:'Todos los días'};
function sameTaper(a,b,k){
  if(!a.taper&&!b.taper)return true;if(!a.taper||!b.taper)return false;
  const x=taperFor(a,k)||{},y=taperFor(b,k)||{};
  return a.taper.step===b.taper.step&&a.taper.every===b.taper.every&&(a.taper.min??null)===(b.taper.min??null)&&x.mg===y.mg&&x.count===y.count;
}
const DOSING=['strength','unit','qty','freq','times'];
const isDosingChange=(a,b,k)=>DOSING.some(f=>JSON.stringify(a[f]??null)!==JSON.stringify(b[f]??null))||!sameTaper(a,b,k);
/* Cambio de dosis/horario desde la fecha eff: cierra la versión vigente el día anterior y abre una nueva. Cambios de nombre o nota se aplican en el lugar. */
function applyChange(list,gid,eff,patch){
  const cur=pickV(list,gid,eff);if(!cur)return;
  const next={...cur,...patch};
  if(!isDosingChange(cur,next,eff)||(cur.from||'')>=eff){Object.assign(cur,patch);return}
  const oldUntil=cur.until;cur.until=dkey(addDays(parseKey(eff),-1));
  const nv={...next,id:gid+'-'+eff.replace(/-/g,''),gid,from:eff};
  if(oldUntil&&oldUntil>=eff)nv.until=oldUntil;else delete nv.until;
  list.push(nv);
}
function describeChange(a,b){
  const pk=dkey(addDays(parseKey(b.from),-1)), out=[], da=doseText(a,pk), dn=doseText(b,b.from);
  if(da!==dn)out.push(`${da} → ${dn}`);else if(a.taper&&b.taper)out.push(taperNote(b,b.from));
  if(a.times.join()!==b.times.join())out.push(`horario ${a.times.join(', ')} → ${b.times.join(', ')}`);
  if(freqLabel(a)!==freqLabel(b))out.push(`${freqLabel(a).toLowerCase()} → ${freqLabel(b).toLowerCase()}`);
  return out.join('; ')||'ajuste';
}
function changeLog(){
  const base=(S.plan&&S.plan.base)||'', out=[];
  for(const g of gids()){
    const vs=allV().filter(m=>gidOf(m)===g).sort(byFrom);
    vs.forEach((v,j)=>{
      if(j===0){if(v.from&&v.from>base)out.push({k:v.from,text:`Nuevo: ${v.name} · ${doseText(v,v.from)} · ${v.times.join(', ')}`})}
      else out.push({k:v.from,text:`${v.name}: ${describeChange(vs[j-1],v)}`});
    });
    const last=vs[vs.length-1];
    if(last&&last.until)out.push({k:dkey(addDays(parseKey(last.until),1)),text:`${last.name}: suspendido`});
  }
  return out.sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:0);
}
function stats(n=7){
  const r={total:0,taken:0,late:[],miss:[],skip:[],devs:[],days:[]};
  for(let i=n-1;i>=0;i--){
    const k=dkey(addDays(today0(),-i));let dt=0,dk=0;
    for(const s of slotsFor(k)){
      const st=s.st;
      if(!['ok','late','skip','miss'].includes(st.k))continue;
      dt++;
      if(st.k==='ok'||st.k==='late'){dk++;if(st.k==='late')r.late.push({k,...s});if(s.med.strict&&st.diff!=null)r.devs.push(Math.abs(st.diff))}
      else if(st.k==='skip')r.skip.push({k,...s});else r.miss.push({k,...s});
    }
    r.total+=dt;r.taken+=dk;r.days.push({k,total:dt,taken:dk});
  }
  r.pct=r.total?Math.round(r.taken/r.total*100):null;
  r.dev=r.devs.length?Math.round(r.devs.reduce((a,b)=>a+b,0)/r.devs.length):null;
  return r;
}
const pctCls=p=>p==null?'':p>=95?'ok':p>=85?'warn':'bad';
const band=t=>{const m=toMin(t);return m<720?{k:'am',label:'Mañana'}:m<1080?{k:'pm',label:'Tarde'}:{k:'nt',label:'Noche'}};
const tacroMed=()=>medsOn(todayKey()).find(m=>/tacro/i.test(m.name));
const labDiff=()=>S.plan&&S.plan.labDate?daysBetween(todayKey(),S.plan.labDate):null;
const dayKeys=()=>Object.keys(S.days).sort();

/* ---------- controles y alertas ---------- */
function readingAlerts(c){
  const a=[];
  if(c.temp!=null){if(c.temp>=38)a.push(['bad',`Fiebre ${fmtNum(c.temp)} °C`,'Llama hoy a tu unidad de trasplante.']);else if(c.temp>=37.5)a.push(['warn',`Febrícula ${fmtNum(c.temp)} °C`,'Vuelve a medir en 1 hora.'])}
  if(c.pas!=null&&c.pad!=null){if(c.pas>=150||c.pad>=95)a.push(['warn',`Presión alta ${c.pas}/${c.pad}`,'Repite la medición en reposo en 15 min.']);else if(c.pas<95)a.push(['warn',`Presión baja ${c.pas}/${c.pad}`,'Siéntate, hidrátate y vuelve a medir.'])}
  return a;
}
function dayAlerts(k){
  const d=day(k), out=[];
  (d.ctrl||[]).forEach(c=>readingAlerts(c).forEach(a=>out.push({a,k,t:c.t})));
  const red=(d.sint||[]).filter(s=>RED_SYMPTOMS.includes(s));
  if(red.length)out.push({a:['bad',red.join(', '),'Síntoma de alarma: comunícate con tu unidad.'],k});
  if(d.peso!=null){
    const prev=dayKeys().filter(x=>x<k&&S.days[x].peso!=null).pop();
    if(prev&&d.peso-S.days[prev].peso>=1.5)out.push({a:['warn',`Subiste ${fmtNum(d.peso-S.days[prev].peso)} kg desde el ${fmtShort(prev)}`,'Revisa si hay hinchazón y avisa a tu unidad.'],k});
  }
  return out;
}
function recentAlerts(n=7){const out=[];for(let i=0;i<n;i++)out.push(...dayAlerts(dkey(addDays(today0(),-i))));return out}
function lastWith(f){const ks=dayKeys().filter(k=>S.days[k][f]!=null);const k=ks.pop();return k?{k,v:S.days[k][f]}:null}

async function fetchAll(q){const out=[];for(let f=0;;f+=1000){const {data,error}=await q().range(f,f+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
async function loadPatient(pid){
  const since=dkey(addDays(today0(),-90));
  const [pt,mv,ds,dy,rd,lb]=await Promise.all([
    sb.from('patients').select('*').eq('id',pid).maybeSingle(),
    fetchAll(()=>sb.from('med_versions').select('*').eq('patient_id',pid).order('from_date')),
    fetchAll(()=>sb.from('doses').select('*').eq('patient_id',pid).gte('day',since).order('day')),
    fetchAll(()=>sb.from('days').select('*').eq('patient_id',pid).order('day')),
    fetchAll(()=>sb.from('readings').select('*').eq('patient_id',pid).order('day').order('t')),
    fetchAll(()=>sb.from('labs').select('*').eq('patient_id',pid).order('day'))]);

function assemble(p,mv,ds,dy,rd,lb){

  const days={}, D=k=>(days[k]=days[k]||{});
  ds.forEach(r=>{const d=D(r.day);d.doses=d.doses||{};const o={s:r.status};if(r.at)o.at=r.at;if(r.until)o.until=r.until;if(r.qty!=null)o.q=Number(r.qty);if(r.mg!=null)o.mg=Number(r.mg);if(r.n!=null)o.n=r.n;if(r.reason)o.reason=r.reason;if(r.nt)o.nt=true;if(r.verif)o.verif=r.verif;d.doses[r.med_gid+'#'+r.idx]=o});
  dy.forEach(r=>{const d=D(r.day);if(r.peso!=null)d.peso=Number(r.peso);if(r.diu!=null)d.diu=r.diu;if(r.agua!=null)d.agua=r.agua;if(r.dren!=null)d.dren=r.dren;if(r.sint&&r.sint.length)d.sint=r.sint;if(r.nota)d.nota=r.nota});
  rd.forEach(r=>{const d=D(r.day);(d.ctrl=d.ctrl||[]).push({id:r.id,t:r.t,...(r.pas!=null?{pas:r.pas,pad:r.pad}:{}),...(r.temp!=null?{temp:Number(r.temp)}:{})})});
  lb.forEach(r=>{const o={};['tac','hb','urea','crea'].forEach(f=>{if(r[f]!=null)o[f]=Number(r[f])});if(Object.keys(o).length)D(r.day).labs=o});
  return {plan,days};
}
function dayOps(k,d,prev,pid){
  const ops=[], dd=d.doses||{}, pd=prev.doses||{};
  for(const key of new Set([...Object.keys(dd),...Object.keys(pd)])){
    const cut=key.lastIndexOf('#'), gid=key.slice(0,cut), idx=Number(key.slice(cut+1)), a=dd[key];
    if(!a){ops.push({t:'del',table:'doses',match:{patient_id:pid,day:k,med_gid:gid,idx}});continue}
    if(JSON.stringify(a)===JSON.stringify(pd[key]))continue;
    ops.push({t:'up',table:'doses',row:{patient_id:pid,day:k,med_gid:gid,idx,status:a.s,at:a.at||null,until:a.until||null,qty:a.q??null,mg:a.mg??null,n:a.n??null,reason:a.reason||null,nt:!!a.nt,verif:a.verif||null}});
  }
  const dayF=x=>JSON.stringify([x.peso??null,x.diu??null,x.dren??null,x.agua??null,x.sint||[],x.nota||'']);
  if(dayF(d)!==dayF(prev))ops.push({t:'up',table:'days',row:{patient_id:pid,day:k,peso:d.peso??null,diu:d.diu??null,dren:d.dren??null,agua:d.agua??null,sint:d.sint||[],nota:d.nota||''}});
  const cr=d.ctrl||[], pr=prev.ctrl||[];
  cr.forEach(c=>{const o=pr.find(x=>x.id===c.id);if(!o||JSON.stringify(o)!==JSON.stringify(c))ops.push({t:'up',table:'readings',row:{patient_id:pid,id:c.id,day:k,t:c.t||null,pas:c.pas??null,pad:c.pad??null,temp:c.temp??null}})});
  pr.forEach(o=>{if(!cr.some(c=>c.id===o.id))ops.push({t:'del',table:'readings',match:{patient_id:pid,id:o.id}})});
  if(JSON.stringify(d.labs||{})!==JSON.stringify(prev.labs||{})){const l=d.labs||{};ops.push(Object.keys(l).length?{t:'up',table:'labs',row:{patient_id:pid,day:k,tac:l.tac??null,hb:l.hb??null,urea:l.urea??null,crea:l.crea??null}}:{t:'del',table:'labs',match:{patient_id:pid,day:k}})}
  return ops;
}
function planOps(p,prev,pid){
  const prow={id:pid,tx_date:p.txDate||null,lab_date:p.labDate||null,lab_tentative:!!p.labTentative,base_date:p.base||todayKey(),verify:p.verify||{mode:'off',scope:'strict'},water_goal:p.waterGoal||3000};
  const ops=[pid===(session&&session.user.id)?{t:'up',table:'patients',row:prow}:{t:'upd',table:'patients',row:prow,match:{id:pid}}];

  p.meds.forEach(v=>{const o=pm.find(x=>x.id===v.id);if(!o||JSON.stringify(o)!==JSON.stringify(v))ops.push({t:'up',table:'med_versions',row:fromV(v,pid)})});
  pm.forEach(o=>{if(!p.meds.some(v=>v.id===o.id))ops.push({t:'del',table:'med_versions',match:{patient_id:pid,id:o.id}})});

}

async function flush(){

    while(outbox.length){
      const op=outbox[0];
      const {error}=op.t==='up'?await sb.from(op.table).upsert(op.row):op.t==='upd'?await sb.from(op.table).update(op.row).match(op.match):await sb.from(op.table).delete().match(op.match);
      if(error){if(isNetErr(error))break;console.warn(op,error);toast('No se pudo guardar un cambio. Revisa los datos e inténtalo otra vez.')}
      outbox.shift();LS.set(OBK(),outbox);
    }
  }catch(e){}
  flushing=false;renderTop();
  uploadPending();
}

/* ---------- ventana sin comida ni otras pastillas (p. ej. tacrolimus) ---------- */
function windowsFor(k){
  const out=[];
  medsOn(k).forEach(m=>{
    if(!m.win||!scheduledOn(m,k))return;
    m.times.forEach((t,i)=>{
      const r=rec(k,m,i), s=toMin(t), took=r&&r.s==='taken'&&r.at?toMin(r.at):null;
      out.push({med:m,i,time:t,start:s-(m.win.before||0),take:s,took,after:m.win.after||0,end:(took!=null?Math.max(took,s):s)+(m.win.after||0),skip:!!(r&&r.s==='skip')});
    });
  });
  return out;
}
function windowConflicts(k){
  const out=[];
  windowsFor(k).forEach(w=>slotsFor(k).forEach(s=>{if(gidOf(s.med)===gidOf(w.med))return;const t=toMin(s.time);if(t>w.start&&t<w.take+w.after)out.push({w,s})}));
  return out;
}
const winLabel=m=>m.win?`Ventana: ${m.win.before||0} min antes y ${m.win.after||0} min después, sin comida ni otras pastillas`:'';

function windowCard(k){
  const n=nowMin();
  const w=windowsFor(k).find(w=>!w.skip&&n>=w.start-30&&(w.took==null?n<w.take+120:n<w.end));
  if(!w)return '';
  const name=esc(w.med.name), taken=w.took!=null;
  const end=taken?w.end:(n>w.take?n+w.after:w.end), span=Math.max(1,end-w.start);
  const pos=x=>Math.min(100,Math.max(0,(x-w.start)/span*100)).toFixed(1);
  let chip,msg;
  if(taken){chip=`<span class="chip ok">Faltan ${fmtDur(Math.max(0,end-n))}</span>`;msg=`Tomaste el ${name} a las <b class="num">${fromMin(w.took)}</b>. Puedes comer y tomar lo demás desde las <b class="num">${fromMin(end)}</b>.`}
  else if(n<w.start){chip=`<span class="chip neutral">En ${fmtDur(w.start-n)}</span>`;msg=`Empieza a las <b class="num">${fromMin(w.start)}</b>. Desde esa hora no comas ni tomes otras pastillas.`}
  else if(n<w.take){chip=`<span class="chip due"><i class="pulse"></i>Ventana abierta</span>`;msg=`No comas ni tomes otras pastillas. ${name} a las <b class="num">${w.time}</b>, en ${fmtDur(w.take-n)}.`}
  else{chip=`<span class="chip bad">Tómalo ya</span>`;msg=`Toma tu ${name} ahora. La ventana termina ${w.after} min después de tomarlo.`}
  return `<section class="card wcard" aria-label="Ventana del ${name}">
    <div class="sec-h"><h2>Ventana del ${name}</h2>${chip}</div>
    <p>${msg}</p>
    <div class="wbar" role="img" aria-label="De ${fromMin(w.start)} a ${fromMin(end)}"><i class="fill" style="width:${pos(n)}%"></i><i class="mk soon" style="left:${pos(w.take-5)}%"></i><i class="mk" style="left:${pos(taken?w.took:w.take)}%"></i></div>
    <div class="wlab num"><span>${fromMin(w.start)}<small>inicio</small></span><span>${taken?fromMin(w.took):w.time}<small>${taken?'tomado':'toma'}</small></span><span>${fromMin(end)}<small>fin</small></span></div>
  </section>`;
}

let schedHash='', pendingAction=null, afterT;
const afterChange=()=>{cacheSave();clearTimeout(afterT);afterT=setTimeout(syncNative,80)};
function buildSchedule(){
  const items=[], now=Date.now();
  for(let d=0;d<3;d++){
    const k=dkey(addDays(today0(),d)), groups={};
    slotsFor(k).forEach(s=>{if(!isDone(s.st.k))(groups[s.time]=groups[s.time]||[]).push(s)});
    for(const [t,list] of Object.entries(groups)){
      const sn=list.map(s=>rec(k,s.med,s.i)).find(r=>r&&r.s==='snooze');
      const base=parseKey(k);const [h,mi]=(sn?sn.until:t).split(':').map(Number);base.setHours(h,mi,0,0);
      const body=list.map(s=>`${s.med.name}: ${doseText(s.med,k)}`).join('\n');
      const lvl=list.map(s=>levelOf(s.med)).sort((a,b)=>LV_RANK[b]-LV_RANK[a])[0], flex=lvl==='flexible';
      // Aviso 10 minutos antes (suave para los flexibles)
      if(!sn){const w=base.getTime()-10*60000;if(w>now)items.push({id:`${k}|${t}|pre`,at:w,title:`En 10 minutos · ${t}`,body,data:{k,t},kind:'pre',info:true,channel:flex?'soft':'info'})}
      // A la hora: alarma (críticos y profilácticos) o notificación (flexibles), con repeticiones según el nivel
      LEVELS[lvl].rep.forEach((off,j)=>{const w=base.getTime()+off*60000;if(w>now)items.push({id:`${k}|${t}|${j}`,at:w,title:j?`Recuerda tus medicamentos de las ${t}`:`${lvl==='critical'?'Crítico · ':''}Es hora · ${t}`,body,data:{k,t},kind:flex?'dose':'alarm',info:flex})});
    }
  }
  for(let d=0;d<3;d++){
    const k=dkey(addDays(today0(),d)), base=parseKey(k).getTime();
    windowsFor(k).forEach(w=>{
      if(w.skip)return;
      const at=m=>base+m*60000, nm=w.med.name, key=`${k}|${w.time}|win`;
      if(w.took==null){
        if(at(w.start)>now&&w.start<w.take)items.push({id:key+'0',at:at(w.start),title:`Empieza la ventana del ${nm}`,body:`Desde ahora no comas ni tomes otras pastillas. ${nm} a las ${w.time}; la ventana termina ${w.after} min después de tomarlo.`,data:{k,t:w.time},info:true});
      }else if(at(w.end)>now)items.push({id:key+'end',at:at(w.end),title:`Ventana del ${nm} cerrada`,body:'Ya puedes comer y tomar tus otras pastillas.',data:{k,t:w.time},info:true});
    });
  }
  // Controles diarios: peso en ayunas y diuresis 24 h a las 07:00, agua cada 2 h, presión a las 18:00 si falta.
  const goal=(S.plan&&S.plan.waterGoal)||3000;
  for(let d=0;d<3;d++){
    const k=dkey(addDays(today0(),d)), dd=day(k), at=(h,m=0)=>{const x=parseKey(k);x.setHours(h,m,0,0);return x.getTime()};
    if((dd.peso==null||dd.diu==null)&&at(7)>now)items.push({id:`${k}|ctl|am`,at:at(7),title:'Controles de la mañana',body:`${dd.peso==null?'Pésate en ayunas':''}${dd.peso==null&&dd.diu==null?' y ':''}${dd.diu==null?'anota tu diuresis de 24 h':''}.`,data:{k,ctl:1},info:true,channel:'info'});
    const drank=dd.agua||0;
    if(drank<goal)for(let h=8;h<=20;h+=2){if(at(h)>now)items.push({id:`${k}|agua|${h}`,at:at(h),title:'Toma agua',body:`Llevas ${fmtL(drank)} de ${fmtL(goal)} hoy.`,data:{k,ctl:1},info:true,channel:'info'})}
    if(!(dd.ctrl||[]).some(c=>c.pas!=null)&&at(18)>now)items.push({id:`${k}|pa`,at:at(18),title:'Mide tu presión',body:'Todavía no anotas tu presión de hoy.',data:{k,ctl:1},info:true,channel:'info'});
  }
  if(S.plan&&S.plan.labDate){
    const w=addDays(parseKey(S.plan.labDate),-1);w.setHours(20,30,0,0);const tm=tacroMed();
    if(w.getTime()>now)items.push({id:'lab|'+S.plan.labDate,at:w.getTime(),title:`Mañana: dosaje de tacrolimus${S.plan.labTentative?' (por confirmar)':''}`,body:`No tomes ${tm?'la dosis de las '+tm.times[0]:'la dosis de la mañana'} antes de la muestra de sangre. Lleva tus cápsulas.`,data:{lab:1},info:true});
  }
  return items.sort((a,b)=>a.at-b.at).slice(0,240);
}
function syncNative(){
  if(!NATIVE||phase!=='ready'||!canWrite)return;
  const items=buildSchedule(), h=JSON.stringify(items);
  if(h===schedHash)return;schedHash=h;
  try{window.ReactNativeWebView.postMessage(JSON.stringify({type:'schedule',items}))}catch(e){}
}
window.mctNativeAction=function(a){
  if(mode!=='patient'&&hasOwn&&session){pendingAction=a;backToOwn();return}
  if(phase!=='ready'||!canWrite){pendingAction=a;return}
  if(!a||!a.k||!a.t)return;
  const list=slotsFor(a.k).filter(s=>s.time===a.t&&!isDone(s.st.k));

const idb=(()=>{

    get:k=>run('readonly',st=>st.get(k)),

    all:()=>open().then(db=>new Promise((res,rej)=>{const out=[];const c=db.transaction('up').objectStore('up').openCursor();c.onsuccess=()=>{const x=c.result;if(x){out.push([x.key,x.value]);x.continue()}else res(out)};c.onerror=()=>rej(c.error)})),

// Dibuja el cuadro de la cámara (como espejo, igual que se ve) y estampa nombre, fecha y hora.
function drawStamped(ctx,v,w,h){
  ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(v,0,0,w,h);ctx.restore();
  const band=Math.round(h*0.075);
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,h-band,w,band);
  ctx.fillStyle='#fff';ctx.font=`600 ${Math.round(band*0.42)}px system-ui,sans-serif`;ctx.textBaseline='middle';
  ctx.fillText(stampTxt(cam.names,new Date()),Math.round(w*0.03),h-band/2,w*0.94);
}
function camCanvas(){
  const v=document.getElementById('cam-video');
  const vw=v.videoWidth||720,vh=v.videoHeight||960,sc=Math.min(1,720/vw);
  const c=document.createElement('canvas');c.width=Math.round(vw*sc);c.height=Math.round(vh*sc);
  return {v,c,ctx:c.getContext('2d')};
}
function camShot(){
  if(!cam||!cam.stream||cam.state!=='live')return;
  const {v,c,ctx}=camCanvas();
  if(cam.mode==='photo'){
    drawStamped(ctx,v,c.width,c.height);
    cam.takenAt=new Date();
    c.toBlob(b=>{if(!cam)return;cam.blob=b;cam.url=URL.createObjectURL(b);cam.state='review';renderCam()},'image/jpeg',0.78);
    return;
  }
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!mime||!c.captureStream){cam.state='error';cam.err='Este celular no permite grabar video aquí. Usa la versión A (foto).';return renderCam()}
  const chunks=[];
  const rec=new MediaRecorder(c.captureStream(24),{mimeType:mime,videoBitsPerSecond:900000});
  cam.rec=rec;cam.state='rec';cam.takenAt=new Date();
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{if(!cam)return;cancelAnimationFrame(cam.raf);cam.blob=new Blob(chunks,{type:mime.split(';')[0]});cam.url=URL.createObjectURL(cam.blob);cam.state='review';renderCam()};
  const loop=()=>{drawStamped(ctx,v,c.width,c.height);cam.raf=requestAnimationFrame(loop)};loop();
  rec.start(250);
  const btn=camIn().querySelector('.shutter');if(btn)btn.disabled=true;
  const cnt=document.getElementById('cam-count');let left=5;
  const step=()=>{if(!cam||cam.rec!==rec)return;if(cnt){cnt.hidden=false;cnt.textContent=left}if(left--<=0){rec.stop();return}setTimeout(step,1000)};step();
}
async function camSend(){

const auditCache={};
const ROLE_LABEL={patient:'Paciente',doctor:'Médico/a',nurse:'Licenciada',admin:'Admin',system:'Sistema',other:'Otro'};
function auditText(e){
  const A=e.after||{}, B=e.before||{};
  const tm=x=>(x||[]).join(', '), lv=x=>(LEVELS[x]||{}).label||'—';
  if(e.entity==='med_versions'){
    const name=A.name||B.name||'Medicamento';
    if(e.action==='insert')return `${name}: agregado · ${A.qty!=null?fmtQty(Number(A.qty))+' '+unitWord(A.unit,Number(A.qty)):''}${A.strength?' de '+A.strength:''} · ${tm(A.times)}${A.from_date?' · desde el '+fmtShort(A.from_date):''}`;
    if(e.action==='delete')return `${name}: borrado`;
    const ch=[];
    if(String(A.qty)!==String(B.qty))ch.push(`cantidad ${B.qty??'—'} → ${A.qty??'—'}`);
    if((A.strength||'')!==(B.strength||''))ch.push(`concentración ${B.strength||'—'} → ${A.strength||'—'}`);
    if(tm(A.times)!==tm(B.times))ch.push(`horario ${tm(B.times)} → ${tm(A.times)}`);
    if(JSON.stringify(A.freq)!==JSON.stringify(B.freq))ch.push(`${freqLabel({freq:B.freq}).toLowerCase()} → ${freqLabel({freq:A.freq}).toLowerCase()}`);
    if(A.until_date!==B.until_date)ch.push(A.until_date?`termina el ${fmtShort(A.until_date)}`:'sin fecha de fin');
    if(A.level!==B.level)ch.push(`nivel ${lv(B.level)} → ${lv(A.level)}`);
    if(String(A.tol)!==String(B.tol))ch.push(`tolerancia ±${B.tol??'—'} → ±${A.tol??'—'} min`);
    if(JSON.stringify(A.taper)!==JSON.stringify(B.taper))ch.push('esquema de descenso actualizado');
    if(JSON.stringify(A.win)!==JSON.stringify(B.win))ch.push('ventana sin comida actualizada');
    if((A.note||'')!==(B.note||''))ch.push('indicación actualizada');
    if(A.name!==B.name)ch.push(`nombre ${B.name} → ${A.name}`);
    return `${name}: ${ch.join('; ')||'actualizado'}`;
  }
  if(e.entity==='patients'){
    const ch=[];
    if(A.lab_date!==B.lab_date)ch.push(A.lab_date?`dosaje de tacrolimus el ${fmtShort(A.lab_date)}`:'sin fecha de dosaje');
    if(A.tx_date!==B.tx_date)ch.push(`fecha del trasplante ${A.tx_date?fmtShort(A.tx_date):'—'}`);
    if(String(A.water_goal)!==String(B.water_goal))ch.push(`meta de agua ${fmtL(B.water_goal||0)} → ${fmtL(A.water_goal||0)}`);
    if(JSON.stringify(A.verify)!==JSON.stringify(B.verify))ch.push('verificación de tomas cambiada');
    if(A.lab_tentative!==B.lab_tentative)ch.push(A.lab_tentative?'dosaje por confirmar':'dosaje confirmado');
    return ch.join('; ')||'datos del paciente actualizados';
  }
  if(e.entity==='labs'){
    const v=e.action==='delete'?B:A, f=[['crea','creatinina'],['urea','urea'],['hb','hemoglobina'],['tac','tacrolimus']].filter(([k])=>v[k]!=null).map(([k,l])=>`${l} ${fmtNum(v[k])}`);
    return `Análisis del ${fmtShort(e.entity_id)}${e.action==='delete'?' borrado':': '+f.join(', ')}`;
  }
  return e.entity;
}

function safeRender(){
  const a=document.activeElement;
  if(a&&view.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){pendingRender=true;return}
  render();
}
view.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!view.contains(document.activeElement))render()},0));

const fmtL=ml=>`${fmtNum(Math.round(ml/100)/10)} L`;
const uniqNames=l=>[...new Set(l.map(s=>s.med.name))].join(' · ');
function chipFor(st){
  switch(st.k){
    case 'ok':return `<span class="chip ok">${st.at||'Tomada'}</span>`;
    case 'late':return `<span class="chip warn">${st.at} · ${st.diff>0?fmtDur(st.diff)+' tarde':fmtDur(-st.diff)+' antes'}</span>`;
    case 'skip':return `<span class="chip neutral">No tomada</span>`;
    case 'due':return `<span class="chip due"><i class="pulse"></i>Ahora</span>`;
    case 'snooze':return `<span class="chip warn">${I.bell}${st.until}</span>`;
    case 'overdue':return `<span class="chip bad">Atrasada ${fmtDur(st.mins)}</span>`;
    case 'miss':return `<span class="chip bad">Sin registro</span>`;
    default:return `<span class="chip neutral">Pendiente</span>`;
  }
}
function viewHoy(){
  if(!gids().length)return `<div class="card"><h2>Tu plan está vacío</h2><p class="sub">Agrega los medicamentos de tu cuaderno con su dosis y horarios.</p>${canWrite?`<button class="btn primary" data-act="plan">${I.list} Abrir mi plan</button>`:''}</div>`;
  const k=todayKey(), slots=slotsFor(k), n=nowMin();
  const done=slots.filter(s=>isDone(s.st.k)).length;
  const over=slots.filter(s=>s.st.k==='overdue'), due=slots.filter(s=>s.st.k==='due'||s.st.k==='snooze'), pend=slots.filter(s=>s.st.k==='pending');
  let hero;
  if(over.length){
    const t=over[0].time;
    hero=`<div class="next bad"><div class="lbl">Tomas atrasadas</div><div class="row-b"><span class="big">${over.length}</span><span>sin registrar desde las <b class="num">${t}</b></span></div><div class="names">${esc(uniqNames(over))}</div><button class="btn" data-act="jump" data-time="${t}">Ver toma de las ${t}</button></div>`;
  }else if(due.length){
    const t=due[0].time, g=due.filter(s=>s.time===t);
    hero=`<div class="next"><div class="lbl">Es hora</div><div class="row-b"><span class="big">${t}</span><span>${g.length} medicamento${g.length>1?'s':''}</span></div><div class="names">${esc(uniqNames(g))}</div>${canWrite?`<button class="btn" data-act="take-group" data-time="${t}">${I.check} Tomé todo lo de las ${t}</button>`:''}</div>`;
  }else if(pend.length){
    const t=pend[0].time, g=pend.filter(s=>s.time===t);
    hero=`<div class="next calm"><div class="lbl">Próxima toma</div><div class="row-b"><span class="big">${t}</span><span>en ${fmtDur(toMin(t)-n)}</span></div><div class="names">${esc(uniqNames(g))}</div></div>`;
  }else{
    const first=slotsFor(dkey(addDays(today0(),1)))[0];
    hero=`<div class="next calm"><div class="lbl">Tomas de hoy completas</div><div class="names">Buen trabajo.${first?` Mañana empiezas a las <span class="num">${first.time}</span> con ${esc(first.med.name)}.`:''}</div></div>`;
  }
  const seg=s=>({ok:'ok',late:'late',skip:'skip',overdue:'over',due:'due',snooze:'due'}[s.st.k]||'');
  const progress=`<div class="sec"><span class="lab"><b class="num">${done}</b> de <b class="num">${slots.length}</b> tomas registradas hoy</span><div class="prog" aria-hidden="true">${slots.map(s=>`<i class="${seg(s)}"></i>`).join('')}</div></div>`;
  let labNote='';
  const ld=labDiff(), tm=tacroMed();
  if(ld!=null&&ld>=0&&ld<=3){
    const when=ld===0?'Hoy':ld===1?`Mañana (${fmtKey(S.plan.labDate)})`:fmtKey(S.plan.labDate).replace(/^./,c=>c.toUpperCase());
    labNote=`<div class="note">${I.flask}<div><b>${when}: dosaje de tacrolimus${S.plan.labTentative?' (por confirmar)':''}.</b> ${S.plan.labTentative?'Confirma la fecha con la licenciada. Si te toman la muestra, toma':'Toma'} ${tm?`la dosis de las ${tm.times[0]}`:'la dosis de la mañana'} después de la muestra de sangre. Lleva las cápsulas contigo.</div></div>`;
  }
  const groups=[...new Set(slots.map(s=>s.time))].map(t=>{
    const items=slots.filter(s=>s.time===t), b=band(t), dn=items.filter(s=>isDone(s.st.k)).length;
    const open=items.some(s=>['due','overdue','snooze'].includes(s.st.k)||(s.st.k==='pending'&&s.st.inMin<=60));
    const rows=items.map(s=>{
      const st=s.st, m=s.med, cls=st.k==='ok'?'done':st.k==='late'?'done late':st.k==='skip'?'skip':'';
      const labDay=ld===0&&tm&&m.id===tm.id&&s.i===0&&!isDone(st.k);
      const tn=taperNote(m,k), rr=rec(k,m,s.i);
      const qd=rr&&rr.s==='taken'&&rr.q!=null&&rr.q!==m.qty?`Tomaste ${fmtQty(rr.q)} ${unitWord(m.unit,rr.q)}`:'';
      return `<div class="med">
        <button class="check ${cls}" data-act="take" data-med="${gidOf(m)}" data-i="${s.i}" data-k="${k}"${canWrite?'':' disabled'} aria-label="${esc(m.name)} de las ${t}: ${isDone(st.k)?'ver registro':'marcar como tomada'}">${st.k==='skip'?I.x:I.check}</button>
        <button class="med-body" data-act="open" data-med="${gidOf(m)}" data-i="${s.i}" data-k="${k}"><span class="med-name">${esc(m.name)}</span><span class="med-dose">${esc(doseText(m,k))}</span>${m.note?`<span class="med-note">${esc(m.note)}</span>`:''}${tn?`<span class="taper">${esc(tn)}</span>`:''}${qd?`<span class="taper">${esc(qd)}</span>`:''}${labDay?'<span class="taper">Hoy: tomar después de la muestra</span>':levelTag(m)?`<span class="strict">${levelTag(m)}${m.win?' · sin comida ni pastillas '+(m.win.before||0)+' min antes y '+(m.win.after||0)+' min después':''}</span>`:''}</button>
        ${chipFor(st)}
      </div>`;
    }).join('');
    return `<section class="slot" id="g-${t.replace(':','')}" style="--b:var(--${b.k})"><div class="slot-h"><span class="slot-time">${t}</span><span class="band">${b.label}</span><span class="slot-meta">${dn}/${items.length}</span>${canWrite&&open&&dn<items.length?`<button class="btn small" data-act="take-group" data-time="${t}">Tomé todo</button>`:''}</div>${rows}</section>`;
  }).join('');
  const tmw=dkey(addDays(today0(),1)), up=changeLog().filter(c=>c.k===tmw||c.k===k);
  const upNote=up.length?`<div class="note info">${I.pill}<div><b>Cambios en tu tratamiento</b>${up.map(c=>`<br>${c.k===k?'Desde hoy':'Desde mañana'}: ${esc(c.text)}`).join('')}</div></div>`:'';
  const off=medsOn(k).filter(m=>!scheduledOn(m,k)).map(m=>{const nx=nextOn(m,k);return `<span><b>${esc(m.name)}</b> · ${esc(freqLabel(m).toLowerCase())}${nx?` · toca ${nx.i===1?'mañana':'el '+fmtKey(nx.kk)}`:''}</span>`});
  const wc=windowConflicts(k);
  const wcNote=wc.length?`<div class="note">${I.alert}<div><b>Hay pastillas dentro de la ventana del ${esc(wc[0].w.med.name)}.</b> ${wc.map(c=>`${esc(c.s.med.name)} a las <span class="num">${c.s.time}</span>`).join(', ')} cae entre las <span class="num">${fromMin(wc[0].w.start)}</span> y las <span class="num">${fromMin(wc[0].w.take+wc[0].w.after)}</span>. Consulta con tu equipo si debes cambiar la hora.</div></div>`:'';
  return `${hero}${windowCard(k)}${dailyCard(k)}${wcNote}${labNote}${upNote}${progress}<div class="stack">${groups}</div>${off.length?`<div class="offday"><span class="lab">Hoy no toca</span>${off.join('')}</div>`:''}<p class="hint">Toca el círculo para marcar una toma a la hora actual. Toca el nombre para registrar otra hora, posponer o anotar que no la tomaste.</p>`;
}

    <dl class="kv" style="margin:0">
      <div><dt>Presión</dt><dd>${pa.length?pa.map(c=>`${c.pas}/${c.pad}${c.t?` <small>${c.t}</small>`:''}`).join('<br>'):'—'}</dd></div>

    </dl>

  </div>`;

}

function viewAnalisis(){
  const L=LABS.find(x=>x[0]===labSel), pts=labSeries(labSel);

function niceTicks(max){
  if(!(max>0))return[0,1];
  const rough=max/4, mag=Math.pow(10,Math.floor(Math.log10(rough))), nrm=rough/mag;
  const step=(nrm<=1?1:nrm<=2?2:nrm<=2.5?2.5:nrm<=5?5:10)*mag;
  const out=[];for(let v=0;v<=max+step*0.001||out.length<2;v+=step)out.push(Number(v.toFixed(6)));
  if(out[out.length-1]<max)out.push(Number((out[out.length-1]+step).toFixed(6)));
  return out;
}
function drawChart(){
  const box=document.getElementById('chart');if(!box)return;
  const L=LABS.find(x=>x[0]===labSel), pts=labSeries(labSel);
  if(!pts.length){box.innerHTML='';box.style.minHeight='0';return}
  const W=Math.max(260,box.clientWidth), H=210, pl=38, pr=42, pt=14, pb=28;
  const ts=pts.map(p=>parseKey(p.k).getTime()), t0=Math.min(...ts), t1=Math.max(...ts);
  const X=t=>t1===t0?pl+(W-pl-pr)/2:pl+(t-t0)/(t1-t0)*(W-pl-pr);
  const ticks=niceTicks(Math.max(...pts.map(p=>p.v))), ymax=ticks[ticks.length-1];
  const Y=v=>pt+(1-v/ymax)*(H-pt-pb);
  const xy=pts.map((p,i)=>[X(ts[i]),Y(p.v)]);
  let xl=[0,Math.round((pts.length-1)/3),Math.round(2*(pts.length-1)/3),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  const kept=[];xl.forEach(i=>{if(!kept.length||xy[i][0]-xy[kept[kept.length-1]][0]>=60)kept.push(i)});
  if(kept[kept.length-1]!==pts.length-1&&pts.length>1){kept.pop();kept.push(pts.length-1)}
  const line=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=pts.length>1?`${line} L${xy[xy.length-1][0].toFixed(1)} ${Y(0)} L${xy[0][0].toFixed(1)} ${Y(0)} Z`:'';
  const lp=xy[xy.length-1];
  box.style.minHeight='';
  box.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L[1]}: ${pts.length} resultados del ${fmtShort(pts[0].k)} al ${fmtShort(pts[pts.length-1].k)}. Último ${fmtNum(pts[pts.length-1].v)} ${L[2]}.">
    ${ticks.map(v=>`<line class="c-grid" x1="${pl}" x2="${W-pr+8}" y1="${Y(v)}" y2="${Y(v)}"/><text class="c-tick" x="${pl-7}" y="${Y(v)+3.5}" text-anchor="end">${fmtNum(v)}</text>`).join('')}
    ${kept.map(i=>`<text class="c-tick" x="${xy[i][0]}" y="${H-8}" text-anchor="${i===0&&pts.length>1?'start':i===pts.length-1&&pts.length>1?'end':'middle'}">${fmtShort(pts[i].k)}</text>`).join('')}
    ${area?`<path class="c-area" d="${area}"/>`:''}
    <path class="c-line" d="${line}"/>
    <line class="c-cross" id="c-cross" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/>
    ${xy.map(p=>`<circle class="c-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/>`).join('')}
    <circle class="c-hi" id="c-hi" r="5.5" cx="0" cy="0" visibility="hidden"/>
    <text class="c-last" x="${(lp[0]+9).toFixed(1)}" y="${(lp[1]+4).toFixed(1)}">${fmtNum(pts[pts.length-1].v)}</text>
  </svg><div class="tip" id="c-tip" hidden></div>`;
  const s=box.querySelector('svg'), tip=box.querySelector('#c-tip'), cross=box.querySelector('#c-cross'), hi=box.querySelector('#c-hi');
  const show=e=>{
    const r=s.getBoundingClientRect(), px=e.clientX-r.left;
    let bi=0,bd=1e9;xy.forEach((p,i)=>{const dd=Math.abs(p[0]-px);if(dd<bd){bd=dd;bi=i}});
    const [x,y]=xy[bi];
    cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('visibility','visible');
    hi.setAttribute('cx',x);hi.setAttribute('cy',y);hi.setAttribute('visibility','visible');
    tip.textContent=`${fmtKey(pts[bi].k)} · ${fmtNum(pts[bi].v)} ${L[2]}`;tip.hidden=false;
    const tw=tip.offsetWidth;tip.style.left=Math.min(Math.max(0,x-tw/2),W-tw)+'px';tip.style.top=Math.max(0,y-40)+'px';
  };
  const hide=()=>{tip.hidden=true;cross.setAttribute('visibility','hidden');hi.setAttribute('visibility','hidden')};
  s.addEventListener('pointermove',show);s.addEventListener('pointerdown',show);s.addEventListener('pointerleave',hide);
}

function openSheet(html){sheetIn.innerHTML=html;if(!sheet.open)sheet.showModal();sheet.scrollTop=0}
const openDose=(id,i,k)=>{cur={id,i:Number(i),k};openSheet(doseHTML());fillVerif()};

let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2800)}
function armed(b,label){
  if(b.dataset.armed)return true;
  const old=b.innerHTML;b.dataset.armed='1';b.textContent=label;
  setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.innerHTML=old}},3500);
  return false;
}
const showErr=(id,msg)=>{const el=document.getElementById(id);el.textContent=msg;el.hidden=false};
const numIn=id=>{const el=document.getElementById(id);const raw=el?el.value.trim().replace(',','.'):'';if(!raw)return null;if(/^\d+\/\d+$/.test(raw)){const [a,b]=raw.split('/').map(Number);return b?a/b:NaN}const x=Number(raw);return Number.isFinite(x)?x:NaN};
const setDose=(k,m,i,val)=>{saveDay(k,d=>{d.doses=d.doses||{};const key=gidOf(m)+'#'+i;if(val)d.doses[key]=val;else delete d.doses[key]});if(val)nativePost({type:'stopAlarm'})};
const defAmt=(m,k)=>{const tp=taperFor(m,k);return tp?(tp.mg!=null?{mg:tp.mg,n:tp.count||null}:{}):(m.qty!=null?{q:m.qty}:{})};
function readAmt(m,k){
  if(m.taper){
    const tp=taperFor(m,k), mg=numIn('d-mg'), n=numIn('d-n');
    if(mg==null||Number.isNaN(mg)||mg<=0)return{err:'Escribe la dosis en mg.'};
    if(n!=null&&(Number.isNaN(n)||n<1||n>m.taper.every))return{err:`La dosis n° va de 1 a ${m.taper.every}.`};
    const changed=n!=null&&(!tp||mg!==tp.mg||n!==tp.count);
    return{rec:{mg,n:n==null?null:Math.round(n)},plan:changed?p=>applyChange(p.meds,gidOf(m),k,{taper:{...m.taper,date:k,mg,n:Math.round(n)}}):null};
  }
  const q=numIn('d-q');
  if(q==null)return{rec:{}};
  if(Number.isNaN(q)||q<=0)return{err:'Revisa la cantidad.'};
  const keep=document.getElementById('d-keep');
  return{rec:{q},plan:keep&&keep.checked&&q!==m.qty?p=>applyChange(p.meds,gidOf(m),k,{qty:q}):null};
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act, k=b.dataset.k||todayKey(), t=b.dataset.time;
  const m=b.dataset.med?versionOn(b.dataset.med,k):null;
  const cm=cur?versionOn(cur.id,cur.k):null;
  switch(a){
    case 'tab':if(location.hash.slice(1)===b.dataset.tab){tab=b.dataset.tab;render()}else location.hash=b.dataset.tab;break;
    case 'take':{
      if(!canWrite||!m)break;
      const st=slotStatus(k,m,+b.dataset.i);
      if(isDone(st.k)){openDose(gidOf(m),b.dataset.i,k);break}
      const at=nowHHMM();setDose(k,m,+b.dataset.i,{s:'taken',at,...defAmt(m,k)});toast(`${m.name}: registrada a las ${at}`);
      startVerify(k,[{med:m,i:+b.dataset.i,time:m.times[+b.dataset.i]}]);break;
    }
    case 'open':if(m)openDose(gidOf(m),b.dataset.i,k);break;
    case 'take-group':{
      const at=nowHHMM(), tk=todayKey(), todo=slotsFor(tk).filter(s=>s.time===t&&!isDone(s.st.k));
      saveDay(tk,d=>{d.doses=d.doses||{};todo.forEach(s=>{d.doses[gidOf(s.med)+'#'+s.i]={s:'taken',at,...defAmt(s.med,tk)}})});
      nativePost({type:'stopAlarm'});
      toast(`${todo.length} medicamento${todo.length>1?'s':''} de las ${t} registrado${todo.length>1?'s':''}`);
      startVerify(tk,todo);break;
    }
    case 'jump':document.getElementById('g-'+t.replace(':',''))?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});break;
    case 'plan':openPlan();break;
    case 'close':sheet.close();break;
    case 'd-now':case 'd-at':{
      const at=a==='d-now'?nowHHMM():document.getElementById('d-at').value;
      if(!/^\d{2}:\d{2}$/.test(at))break;
      const am=readAmt(cm,cur.k);if(am.err){showErr('d-err',am.err);break}
      setDose(cur.k,cm,cur.i,{s:'taken',at,...am.rec});if(am.plan)savePlan(am.plan);
      toast(`${cm.name}: registrada a las ${at}${am.plan?' · tu plan se actualizó':''}`);const vk=cur.k,vi=cur.i;sheet.close();
      startVerify(vk,[{med:cm,i:vi,time:cm.times[vi]}]);break;
    }
    case 'd-snooze':{const until=fromMin(nowMin()+15);setDose(cur.k,cm,cur.i,{s:'snooze',until});toast(`Te recordamos ${cm.name} a las ${until}`);sheet.close();break}
    case 'd-skip':{const r=sheetIn.querySelector('input[name="reason"]:checked');setDose(cur.k,cm,cur.i,{s:'skip',reason:r?r.value:REASONS[0]});toast(`${cm.name}: anotada como no tomada`);sheet.close();break}
    case 'd-undo':setDose(cur.k,cm,cur.i,null);toast('Registro borrado');sheet.close();break;
    case 'sym':b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');break;
    case 'lab':labSel=b.dataset.key;render();break;
    case 'copy':{
      const txt=summaryText(), ta=document.getElementById('sum-fallback');

    case 'p-stop':if(armed(b,'Toca otra vez para suspender')){
      const id=b.dataset.id, eff=document.getElementById('m-eff').value||todayKey();planEdit=null;
      savePlan(p=>{
        const mine=p.meds.filter(x=>gidOf(x)===id), keep=mine.filter(x=>(x.from||'')<eff);
        if(!keep.length){mine.forEach(x=>{x.until=dkey(addDays(parseKey(x.from||eff),-1))});return}
        p.meds=p.meds.filter(x=>gidOf(x)!==id||(x.from||'')<eff);
        keep.sort(byFrom).pop().until=dkey(addDays(parseKey(eff),-1));
      });
      refreshPlan();toast(`Suspendido desde el ${fmtShort(eff)}`);
    }break;
  }
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='p-tx'&&e.target.value)savePlan(p=>{p.txDate=e.target.value});
  if(id==='p-lab')savePlan(p=>{p.labDate=e.target.value});
  if(id==='p-water'){const l=Number(String(e.target.value).replace(',','.'));if(l>=0.5&&l<=8)savePlan(p=>{p.waterGoal=Math.round(l*1000)});else toast('Escribe la meta en litros, por ejemplo 3')}
  if(id==='p-labt')savePlan(p=>{p.labTentative=e.target.checked});
  if(id==='m-freq'){document.getElementById('f-alt').hidden=e.target.value!=='alt';document.getElementById('f-w').hidden=e.target.value!=='w'}
  if(id==='m-win')document.getElementById('f-win').hidden=!e.target.checked;
  if(id==='m-level')document.getElementById('m-tol').value=LEVELS[e.target.value].tol;
  if(id==='m-tp'){document.getElementById('f-tp').hidden=!e.target.checked;document.getElementById('f-qty').hidden=e.target.checked}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='vit-form'){
    const k=document.getElementById('v-date').value||todayKey(), hora=document.getElementById('v-hora').value||null;
    const v={};
    for(const [f,l,,,,lo,hi] of FIELDS){const x=numIn('v-'+f);if(x===null)continue;if(Number.isNaN(x)||x<lo||x>hi)return showErr('v-err',`Revisa ${l.toLowerCase()}: debe estar entre ${lo} y ${hi}.`);v[f]=x}
    if((v.pas==null)!==(v.pad==null))return showErr('v-err','Escribe la presión completa: la alta y la baja.');
    const sint=[...document.querySelectorAll('#vit-form .tog[aria-pressed="true"]')].map(x=>x.dataset.val);
    const nota=document.getElementById('v-nota').value.trim();
    if(!Object.keys(v).length&&!sint.length&&!nota)return showErr('v-err','Completa al menos un dato antes de guardar.');
    const reading=(v.pas!=null||v.temp!=null)?{id:'c'+Date.now().toString(36),t:hora,...(v.pas!=null?{pas:v.pas,pad:v.pad}:{}),...(v.temp!=null?{temp:v.temp}:{})}:null;
    saveDay(k,d=>{
      if(reading)d.ctrl=[...(d.ctrl||[]),reading];
      if(v.peso!=null)d.peso=v.peso;
      if(v.diu!=null)d.diu=v.diu;
      if(v.agua!=null)d.agua=(d.agua||0)+v.agua;
      if(sint.length)d.sint=[...new Set([...(d.sint||[]),...sint])];
      if(nota)d.nota=d.nota?d.nota+' · '+nota:nota;
    });
    const al=reading?readingAlerts(reading):[];
    if(sint.some(s=>RED_SYMPTOMS.includes(s)))al.push(['bad',sint.filter(s=>RED_SYMPTOMS.includes(s)).join(', '),'Síntoma de alarma: comunícate con tu unidad.']);
    flash={alerts:al,at:(k===todayKey()?'':fmtShort(k)+' ')+(hora||nowHHMM())};render();window.scrollTo({top:0});
  }
  if(id==='staff-form'){
    const name=document.getElementById('s-name').value.trim(), email=document.getElementById('s-email').value.trim(), r=document.getElementById('s-role').value, pass=document.getElementById('s-pass').value.trim();
    if(!name)return showErr('s-err','Escribe el nombre.');
    if(!/^\S+@\S+\.\S+$/.test(email))return showErr('s-err','Escribe un correo válido.');
    if(pass.length<8)return showErr('s-err','La contraseña temporal debe tener al menos 8 caracteres.');
    sb.rpc('admin_create_staff',{p_email:email,p_name:name,p_role:r,p_password:pass}).then(async({error})=>{
      if(error)return showErr('s-err',error.message||'No se pudo crear la cuenta.');
      const {data}=await sb.from('staff').select('*').order('created_at');staffList=data||[];sheetIn.innerHTML=staffHTML({email,pass});
    });
  }
  if(id==='pass-form'){
    const pass=document.getElementById('np-pass').value;
    if(pass.length<8)return showErr('np-err','La contraseña debe tener al menos 8 caracteres.');
    sb.auth.updateUser({password:pass}).then(({error})=>{if(error)return showErr('np-err','No se pudo cambiar. Inténtalo otra vez.');document.getElementById('np-pass').value='';toast('Contraseña cambiada')});
  }
  if(id==='auth-form'){
    const email=document.getElementById('a-email').value.trim(), pass=document.getElementById('a-pass').value;
    if(!/^\S+@\S+\.\S+$/.test(email))return showErr('a-err','Escribe un correo válido.');
    if(authMode==='up'&&pass.length<8)return showErr('a-err','La contraseña debe tener al menos 8 caracteres.');
    if(!pass)return showErr('a-err','Escribe tu contraseña.');
    const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
    const tr=m=>/invalid login/i.test(m)?'Correo o contraseña incorrectos.':/not confirmed/i.test(m)?'Primero confirma tu correo: abre el mensaje que te enviamos (revisa también spam).':/already registered/i.test(m)?'Ya existe una cuenta con ese correo. Entra con tu contraseña.':/rate limit|security purposes/i.test(m)?'Demasiados intentos seguidos. Espera unos minutos y vuelve a intentarlo.':/fetch|network/i.test(m)?'Sin conexión a internet. Inténtalo cuando tengas señal.':'No se pudo: '+m;
    if(authMode==='up'){
      const name=document.getElementById('a-name').value.trim(), doc=document.getElementById('a-doc').checked;
      sb.auth.signUp({email,password:pass,options:{data:{display_name:name,role:doc?'clinician':'patient'},emailRedirectTo:CFG.siteUrl}}).then(({data,error})=>{
        btn.disabled=false;
        if(error)return showErr('a-err',tr(error.message||''));
        if(data.session){session=data.session;openSession()}
        else{authMode='in';authMsg=`Te enviamos un correo a <b>${esc(email)}</b>. Ábrelo y toca el enlace para confirmar tu cuenta; luego vuelve aquí y entra.`;render()}
      });
    }else{
      sb.auth.signInWithPassword({email,password:pass}).then(({data,error})=>{
        btn.disabled=false;
        if(error)return showErr('a-err',tr(error.message||''));
        session=data.session;authMsg='';openSession();
      });
    }
  }
  if(id==='reset-form'){
    const pass=document.getElementById('r-pass').value;
    if(pass.length<8)return showErr('r-err','La contraseña debe tener al menos 8 caracteres.');
    sb.auth.updateUser({password:pass}).then(({error})=>{if(error)return showErr('r-err','No se pudo guardar. Pide otro correo de cambio de contraseña.');toast('Contraseña guardada');openSession()});
  }
  if(id==='team-form'){
    const email=document.getElementById('t-email').value.trim();
    if(!/^\S+@\S+\.\S+$/.test(email))return showErr('t-err','Escribe el correo de tu médico.');
    sb.rpc('grant_access',{clinician_email:email}).then(({data,error})=>{
      if(error)return showErr('t-err',isNetErr(error)?'Sin conexión. Inténtalo cuando tengas señal.':'No se pudo dar acceso.');
      if(data==='not_found')return showErr('t-err','No hay ninguna cuenta con ese correo. Pídele a tu médico que primero cree su cuenta marcando "Soy médico/a".');
      if(data==='self')return showErr('t-err','Ese es tu propio correo.');
      toast('Listo: ahora puede ver tu cuaderno');loadTeam();
    });
  }
  if(id==='lab-form'){
    const k=document.getElementById('l-date').value||todayKey(), vals={};
    for(const l of LABS){const x=numIn('l-'+l[0]);if(x===null)continue;if(Number.isNaN(x)||x<0||x>1000)return showErr('l-err',`Revisa ${l[1].toLowerCase()}.`);vals[l[0]]=x}
    if(!Object.keys(vals).length)return showErr('l-err','Escribe al menos un resultado.');
    saveDay(k,d=>{d.labs={...(d.labs||{}),...vals}});toast(`Resultados del ${fmtShort(k)} guardados`);
  }
  if(id==='med-form'){
    const name=document.getElementById('m-name').value.trim();
    const times=document.getElementById('m-times').value.split(/[,;\s]+/).filter(Boolean);
    if(!name)return showErr('m-err','Escribe el nombre del medicamento.');
    const bad=times.find(x=>!/^([01]?\d|2[0-3]):[0-5]\d$/.test(x));
    if(!times.length||bad)return showErr('m-err',bad?`“${bad}” no es una hora válida. Usa el formato 08:00.`:'Agrega al menos un horario, por ejemplo 08:00.');
    const qty=numIn('m-qty'), useTp=document.getElementById('m-tp').checked;
    if(!useTp&&(qty==null||Number.isNaN(qty)||qty<=0))return showErr('m-err','Escribe cuántas pastillas tomas en cada toma, por ejemplo 2 o 0.5.');
    const ft=document.getElementById('m-freq').value;
    const freq=ft==='alt'?{t:'alt',start:document.getElementById('m-alt').value||todayKey()}:ft==='w'?{t:'w',dow:Number(document.getElementById('m-dow').value)}:{t:'d'};
    let taper=null;
    if(useTp){
      const mg=numIn('tp-mg'),n=numIn('tp-n'),step=numIn('tp-step'),every=numIn('tp-every'),min=numIn('tp-min');
      if([mg,n,step,every].some(x=>x==null||Number.isNaN(x)||x<=0))return showErr('m-err','Completa la dosis de hoy, el número de dosis y cuánto baja.');
      if(n>every)return showErr('m-err',`La dosis n° no puede ser mayor que ${every}.`);
      taper={date:todayKey(),mg,n:Math.round(n),step,every:Math.round(every),min:min==null||Number.isNaN(min)?null:min};
    }
    const data={name,strength:document.getElementById('m-str').value.trim(),unit:document.getElementById('m-unit').value,qty:useTp?null:qty,type:document.getElementById('m-type').value,times:[...new Set(times.map(x=>fromMin(toMin(x))))].sort((a,b)=>toMin(a)-toMin(b)),freq,note:document.getElementById('m-note').value.trim(),strict:document.getElementById('m-level').value==='critical',level:document.getElementById('m-level').value,tol:Math.max(0,Math.round(numIn('m-tol')??LEVELS[document.getElementById('m-level').value].tol)),taper,win:document.getElementById('m-win').checked?{before:Math.max(0,Math.round(numIn('m-wb')||0)),after:Math.max(0,Math.round(numIn('m-wa')||0))}:null};
    const reason=(document.getElementById('m-reason').value||'').trim();
    if(mode==='view'&&!reason)return showErr('m-err','Escribe el motivo del cambio: queda en la huella.');
    const editing=planEdit, eff=document.getElementById('m-eff').value||todayKey();
    if(data.taper)data.taper.date=eff;
    pendingReason=reason||null;
    savePlan(p=>{if(editing==='new'){const g='m'+Date.now().toString(36);p.meds.push({id:g,gid:g,from:eff,...data})}else applyChange(p.meds,editing,eff,data)});
    pendingReason=null;
    planEdit=null;refreshPlan();toast(`${name} guardado en tu plan`);
  }
});

/* ---------- arranque ---------- */
const validTab=h=>TABS.some(x=>x[0]===h)?h:null;
window.addEventListener('hashchange',()=>{tab=validTab(location.hash.slice(1))||'hoy';render();window.scrollTo({top:0})});
tab=validTab(location.hash.slice(1))||'hoy';
render();

async function openSession(){
  const uid=session.user.id, last=LS.get('mct-last')||{};
  try{const {data,error}=await sb.from('profiles').select('role').eq('id',uid).maybeSingle();if(error)throw error;role=data?data.role:'patient'}
  catch(e){role=last.uid===uid&&last.role?last.role:'patient'}
  try{const {data,error}=await sb.from('staff').select('role,display_name,active').eq('user_id',uid).maybeSingle();if(error)throw error;staffRole=data&&data.active?data.role:null;staffName=data?data.display_name:''}
  catch(e){staffRole=last.uid===uid?last.staffRole||null:null}
  try{const {data,error}=await sb.from('patients').select('id').eq('id',uid).maybeSingle();if(error)throw error;hasOwn=!!data||!staffRole}
  catch(e){hasOwn=last.uid===uid?last.hasOwn!==false:true}
  LS.set('mct-last',{uid,role,staffRole,hasOwn});
  if(staffRole&&(!hasOwn||location.hash==='#panel'))return openPanel();
  if(role==='clinician'&&!staffRole){canWrite=false;if(!validTab(location.hash.slice(1)))tab='equipo';return loadClinicianPatients()}
  mode='patient';patientId=uid;canWrite=true;canEditPlan=true;
  outbox=LS.get(OBK())||[];
  const cached=LS.get(CK());
  if(cached){S={plan:cached.plan,days:cached.days||{}};phase='ready'}else phase='loading';
  render();
  if(!staffRole){try{const {data}=await sb.from('patients').select('id').eq('id',uid).maybeSingle();if(!data)await sb.from('patients').insert({id:uid,base_date:todayKey()})}catch(e){}}
  await refresh();
  loadTeam();
  if(pendingAction){const a=pendingAction;pendingAction=null;window.mctNativeAction(a)}
}
async function loadClinicianPatients(){
  try{
    const {data:links,error}=await sb.from('care_team').select('patient_id').eq('clinician_id',session.user.id);if(error)throw error;
    const ids=(links||[]).map(x=>x.patient_id);
    const {data:pr}=ids.length?await sb.from('profiles').select('id,display_name').in('id',ids):{data:[]};
    patients=ids.map(id=>({id,name:((pr||[]).find(p=>p.id===id)||{}).display_name||'Paciente'}));
  }catch(e){patients=[]}
  const saved=LS.get('mct-doc-pid'), pick=patients.find(p=>p.id===saved)||(patients.length===1?patients[0]:null);
  if(pick)openPatient(pick);else{phase='pick';render()}
}
function openPatient(p){patientId=p.id;patientName=p.name;outbox=[];const c=LS.get(CK());S=c?{plan:c.plan,days:c.days||{}}:{plan:null,days:{}};phase=c?'ready':'loading';render();refresh()}
async function boot(){
  applyTheme();
  if(DEMO){S=demoState();canWrite=true;phase='ready';render();return}
  if(!window.supabase||!CFG.url){phase='error';render();return}
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'mct-auth'}});
  sb.auth.onAuthStateChange((ev,s)=>{if(s)session=s;if(ev==='PASSWORD_RECOVERY'){phase='reset';render()}});
  // Abre al instante con lo guardado en el celular; el servidor actualiza después.
  const last=LS.get('mct-last')||{};
  if(last.uid&&last.role!=='clinician'&&last.hasOwn!==false){
    patientId=last.uid;const c=LS.get(CK());
    if(c){role='patient';canWrite=true;outbox=LS.get(OBK())||[];S={plan:c.plan,days:c.days||{}};phase='ready';render()}
  }
  const {data}=await sb.auth.getSession();session=data.session;
  if(location.hash.includes('access_token')||location.hash.includes('error'))history.replaceState(null,'',location.pathname+location.search);
  if(!session){patientId=null;canWrite=false;S={plan:null,days:{}};phase='auth';render();return}
  if(phase!=='reset')openSession();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&phase==='ready')refresh()});
setInterval(()=>{if(role==='clinician'&&phase==='ready'&&!document.hidden)refresh()},120000);
boot();

const alerted=new Set();
setInterval(()=>{
  if(phase!=='ready')return;
  const k=todayKey(), n=nowMin();
  const dueNow=slotsFor(k).filter(s=>toMin(s.time)===n&&!isDone(s.st.k));
  if(dueNow.length&&!alerted.has(k+dueNow[0].time)){alerted.add(k+dueNow[0].time);toast(`Es hora: ${uniqNames(dueNow)}`)}
  if(tab==='hoy'&&!sheet.open)safeRender();
  syncNative();
},30000);
})();
</script>
